name: Deploy Portfolio to AWS S3 & CloudFront

on:
  push:
    branches:
      - main # O 'master', según el nombre de tu rama principal
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Compilar el sitio estático de Astro
      - name: Build site
        run: npm run build

      # 5. Configurar las credenciales de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Sincronizar carpeta /dist con S3 (--delete borra archivos viejos automáticamente)
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      # 7. Invalidar la caché de CloudFront para que los cambios se vean al instante
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
